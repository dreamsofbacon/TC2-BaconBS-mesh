{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Edit Comment — {{ channel_name }}</h2>
  <p class="text-muted">From: <strong>{{ comment.sender_short_name }}</strong> &middot; {{ comment.date }}</p>
</div>

<div class="card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label for="content">Comment</label>
      <textarea id="content" name="content" class="form-control" rows="6" required>{{ comment.content }}</textarea>
    </div>
    <div class="row-actions" style="margin-top:12px">
      <button class="btn btn-primary" type="submit">Save Changes</button>
      <a class="btn" href="{{ url_for('channel_comments', channel_id=channel_id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
