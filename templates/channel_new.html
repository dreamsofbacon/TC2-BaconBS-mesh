{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px;margin:2rem auto">
  <h2>New Channel</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label for="name">Channel Name</label>
      <input type="text" id="name" name="name" class="form-control" required
             value="{{ request.form.get('name', '') }}">
    </div>
    <div class="form-group">
      <label for="url">Channel URL / Key</label>
      <input type="text" id="url" name="url" class="form-control"
             value="{{ request.form.get('url', '') }}">
    </div>
    <div class="form-group">
      <label for="psk">PSK</label>
      <input type="text" id="psk" name="psk" class="form-control"
             value="{{ request.form.get('psk', '') }}">
    </div>
    <div class="row-actions">
      <button type="submit" class="btn btn-primary">Create Channel</button>
      <a class="btn" href="{{ url_for('table_list', table='channels') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
