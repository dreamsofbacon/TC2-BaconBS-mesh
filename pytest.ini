[pytest]
# The regression suite lives in tests/, and that is all CI runs
# (.github/workflows/tests.yml: python -m pytest tests). Without this a plain
# "pytest" from the repo root -- or an editor's test runner -- also collects
# one-off scripts at the top level whose names happen to start with test_,
# such as test_remote_db.py, and the first of those that cannot import stops
# the whole run before a single real test executes.
testpaths = tests
