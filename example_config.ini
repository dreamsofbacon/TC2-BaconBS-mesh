###############################
#### Select radio + interface ####
###############################
# Meshtastic USB: type = serial
# Meshtastic WiFi: type = tcp
#
# MeshCore companion USB: type = meshcore_serial
# MeshCore companion TCP: type = meshcore_tcp
# MeshCore companion BLE: type = meshcore_ble
#
# MeshCore serial example:
# [interface]
# type = meshcore_serial
# port = /dev/ttyACM0
# baudrate = 115200
# channel_index = 0  ; MeshCore channel for broadcast notifications
#
# MeshCore TCP example:
# [interface]
# type = meshcore_tcp
# hostname = 192.168.1.100
# tcp_port = 5000
#
# MeshCore BLE example (ble_address may be omitted to scan):
# [interface]
# type = meshcore_ble
# ble_address = 12:34:56:78:90:AB
# ble_pin = 123456
#
# [type = serial] for USB connected Meshtastic devices
#If there are multiple serial devices connected, be sure to use the "port" option and specify a port
# Linux Example:
# port = /dev/ttyUSB0
#
# Windows Example:
# port = COM3
# [type = tcp] for network connected devices (ESP32 devices only - this does not work for WisBlock)
# If using tcp, remove the # from the beginning and replace 192.168.x.x with the IP address of your device
# Example:
# [interface]
# type = tcp
# hostname = 192.168.1.100

[interface]
type = serial
#
# type = none  -- this node has NO radio of its own and syncs over MQTT only,
# mirroring another BBS's bulletins/mail/channels. Use this rather than
# pointing at a serial port that will never appear: a named-but-absent device
# is retried forever and shows as a permanently broken link.
#
# port = /dev/ttyACM0
# hostname = 192.168.x.x
#
# IMPORTANT (Linux, especially with two radios): prefer a stable
# /dev/serial/by-id/... or /dev/serial/by-path/... path over /dev/ttyUSBn.
# The ttyUSBn numbers are assigned in enumeration order, so a reboot, a USB
# reconnect, or a different power-up order can renumber them -- or SWAP
# which radio is which, so the BBS tries a Meshtastic handshake against a
# MeshCore board and just looks broken. Run `ls -l /dev/serial/by-id/` (or
# by-path/ if your adapters share a serial number) and use that path here.
# See the README's "Use stable device paths" section.


#####################################
#### Dual-radio bridge mode      ####
#####################################
# Optional: run a SECOND radio on this same node -- one Meshtastic, one
# MeshCore (either order) -- and this node bridges the two networks' BBS
# sync (mail/bulletins/channels/profiles/game saves) through the shared
# local database. See the README's "Dual-Radio Bridge Mode" section for
# how this works. Entirely optional and additive: leave [interface2]
# commented out (or absent) for normal single-radio operation.
#
# [interface2]
# enabled = true
# type = meshcore_tcp
# hostname = 192.168.1.50
# tcp_port = 5000
#
# [sync2]
# bbs_nodes = 7e18ca9d30a1
#
# [allow_list2]
# allowed_nodes = 7e18ca9d30a1

# Passive public-channel history. Only ordinary broadcast text is retained,
# for a fixed maximum of seven days. Empty channel lists disable capture for
# that radio slot. Meshtastic channel 0 is normally LongFast; MeshCore channel
# 0 is normally Public.
# [public_chatter]
# enabled = true
# primary_channels = 0
# secondary_channels = 0


#####################################
#### SSH access                   ####
#####################################
# Separate interactive BBS listener. It stays off until explicitly enabled.
# Register with: ssh -p 2222 new:YourAlias@host
# Return with:   ssh -p 2222 YourAlias@host
# Back up host_key after its first generation; replacing it warns every client.
# Before binding publicly, secure the web admin and add firewall/fail2ban rules.
# [ssh]
# enabled = false
# host = 127.0.0.1
# For LAN access over both address families: host = 0.0.0.0, ::
# port = 2222
# host_key = data/ssh_host_key
# Optional shared SSH transport credentials. When both are set, users connect
# with these first, then register or log in to their own isolated BBS account.
# The shared password is stored as plain text in this file.
# username = baconbbs
# password = choose-a-long-random-password
# registration_enabled = true
# registration_limit_per_hour = 5
# login_limit_per_hour = 20
# max_sessions = 20
# An account has one stable identity, and its menu position is keyed to it,
# so two sessions at once would share a menu -- typing in one window would
# move the other. Raising this trades that isolation away.
# max_sessions_per_account = 1
# idle_timeout_seconds = 1800
# max_text_bytes = 8192


#####################################
#### Fleet updates               ####
#####################################
# Lets one operator move every node in a group onto the same commit, without
# SSH. Off unless you configure it.
#
# The security model in one line: the instruction is broadcast to everyone on
# the topic, but a node only acts on it if the signature matches a key listed
# HERE. A node with no trusted_keys ignores every instruction, which is what
# lets you share an MQTT broker with someone without joining their fleet.
#
# Generate the key on your admin machine, NOT on a node:
#     python scripts/fleet_sign.py --group <group> init
# It prints exactly this block, already filled in.
#
# trusted_keys holds PUBLIC keys only (the fk...:... form). A private key
# here would let anyone who can read this file command the whole fleet, so
# the node refuses to arm updates if it finds one.
#
# updates:
#   auto   - fetch, smoke-test and switch automatically, with rollback
#   notify - record the target and show it in the web admin, apply by hand
#   off    - ignore instructions entirely (default)
#
# pin_commit freezes a node on one commit -- useful while debugging it --
# without having to remove the key.
#
# [fleet]
# group = baconbbs
# trusted_keys = fkabc123:base64publickey
# updates = auto
# pin_commit =
# api_token_hash =
#
# api_token_hash is needed only on a node used as the HTTP seed for
# fleet_sign.py deploy. Generate a token and this hash with:
#   python scripts/fleet_sign.py token
# Keep the raw token on the admin machine; never put it in config.ini.


#####################################
#### MQTT internet-bridge links  ####
#####################################
# Optional: bridge to a BBS node you can't reach over RF at all (a separate
# LoRa mesh island in another city, say) by relaying BBS sync over an
# internet-connected MQTT broker you already run (e.g. self-hosted
# Mosquitto). This project is an MQTT *client* only -- no broker code ships
# here. Purely additive and independent of dual-radio bridge mode above; a
# node can run its normal radio(s) AND any number of [mqttN] links at once.
#
# Each [mqttN] section (N = 1, 2, 3, ... -- not capped at 2 the way
# [interface2] is) is one independent bridge relationship to one broker.
# To bridge three separate remote sites, configure three sections
# ([mqtt1], [mqtt2], [mqtt3]) with three different topic_prefix values --
# do not reuse one topic_prefix for multiple unrelated bridges, since every
# subscriber on a topic sees every message published to it.
#
# [mqtt1]
# enabled = true
# host = broker.example.com
# port = 8883
# tls = true
# username = your-username
# password = your-password
# topic_prefix = baconbs/cityA-cityB   # must be unique per bridge relationship
# local_id = cityA-node                # this node's own label on this link
#
# Advanced TLS / certificates (all optional). `tls = true` on its own
# verifies the broker against the SYSTEM CA store, which is what you want
# for a broker with a publicly-trusted certificate. The settings below are
# only needed for a self-hosted broker with its own private CA, or one that
# requires client-certificate (mutual TLS) authentication. Paths are on THIS
# node's filesystem and must be readable by the user the service runs as.
# Setting any of them enables TLS even without `tls = true`, so certs can
# never be silently ignored on a plaintext connection.
#
# tls_ca_certs = /etc/ssl/certs/my-broker-ca.crt   # private/self-signed CA
# tls_certfile = /etc/baconbs/client.crt           # client cert (mutual TLS)
# tls_keyfile = /etc/baconbs/client.key            # its private key
# tls_keyfile_password = secret                    # only if the key is encrypted
# tls_insecure = false   # true disables broker hostname verification --
#                        # leave false; prefer tls_ca_certs for self-signed
#
# What this broker receives, beyond the sync traffic the bridge exists for.
# Independent per broker, so one node can send full telemetry to a home
# broker and sync only to a remote bridge. publish_status defaults true
# (the original behavior); the rest default false, so adding these options
# changes nothing for an existing config until you opt in.
#
# publish_status = true      # node/link health          -> <prefix>/<id>/status
# publish_clients = false    # devices in range          -> <prefix>/<id>/clients
# publish_telemetry = false  # hw/role counts, battery   -> <prefix>/<id>/telemetry
# publish_activity = false   # new bulletins/mail/posts  -> <prefix>/<id>/activity
# publish_sync_stats = false # sync + DB stats           -> <prefix>/<id>/sync
#
# Root for the PUBLISHED DATA above only. Blank = use topic_prefix. Lets
# telemetry slot into an existing hierarchy without moving the sync topic,
# which both ends of the bridge must agree on.
# publish_prefix = homeassistant/baconbbs
#
# NOTE: topic_prefix, local_id and publish_prefix are normalized for topic
# safety -- whitespace becomes '-', and MQTT wildcards (+ #) are replaced.
# 'Burlington NNE' is stored and published as 'Burlington-NNE'. Since
# local_id is also this node's id on the link, peers must use the
# normalized form.
#
# [sync_mqtt1]
# bbs_nodes = mqtt:baconbs/cityA-cityB:cityB-node
#
# [allow_list_mqtt1]
# allowed_nodes = mqtt:baconbs/cityA-cityB:cityB-node
#
# MQTT has none of LoRa's payload-size or half-duplex constraints, so an
# MQTT link automatically gets fast ("turbo-equivalent") pacing on its own,
# regardless of the global sync_turbo setting below -- do NOT set
# sync_turbo = true just to speed up an MQTT link, especially on a node
# that also has a radio: that would ALSO speed up (and likely destabilize)
# the radio's own LoRa pacing. Radio and MQTT links are always paced
# independently.


############################
#### BBS NODE SYNC LIST ####
############################
# Provide a list of other nodes running Bacon BBS to sync with. For Meshtastic,
# use !node IDs. For MeshCore, use full public keys or unique prefixes of at
# least 12 hexadecimal characters. Each [sync]/[sync2] section's peer list
# must only contain node IDs from that section's own radio's network -- see
# "Dual-radio bridge mode" below if you want one node to sync BOTH networks.
# Example:
# [sync]
# bbs_nodes = !17d7e4b7,!18e9f5a3,!1a2b3c4d

# [sync]
# bbs_nodes = !17d7e4b7
# sync_zork_saves = false
#
# Pull-only subscriber nodes (e.g. a low-power Pico cache node). This node
# answers their WANT/HASHMISS sync requests but never push-syncs or hash-repairs
# TO them, so they cause no reconcile churn. Put cache nodes here, NOT in
# bbs_nodes. Also settable in the web GUI (Settings -> Subscriber Nodes).
# subscriber_nodes = !a1b2c3d4
#
# Replication speed tuning. Defaults are conservative for busy meshes.
# For small meshes (e.g. 2 BBS nodes), enabling sync_turbo dramatically
# speeds up replication by lowering inter-frame pause and per-cycle caps.
# WARNING: only enable sync_turbo on small meshes (2-3 BBS nodes on the
# same channel). The inter-frame pause is what prevents LoRa packet
# collisions; with 3+ active BBS peers turbo can WORSEN convergence by
# causing the very packet loss it tries to outrun.
# sync_turbo = false
# sync_pause_seconds = 0.75          # delay between TX frames (turbo: 0.02)
# hash_repair_pause_seconds = 0.1    # delay between repair frames (turbo: 0.0)
# hash_chunk_pause_seconds = 1.5     # MINIMUM gap between consecutive HASHZ
#                                    # manifest chunks and between HASHREQ
#                                    # frames sent to the same peer. NOT
#                                    # affected by sync_turbo. Lowering risks
#                                    # the receiver's LoRa radio dropping
#                                    # trailing manifest chunks, which silently
#                                    # breaks the entire reconcile cycle.
#                                    # Only lower on non-LoRa transports.
# repair_cycle_seconds = 90          # min seconds between repair cycles per peer
#                                    #   (turbo default: 30)
# reconcile_max_per_pass = 20        # max records pulled/pushed per repair cycle
#                                    #   (turbo default: 100)
# full_sync_delay_ms = 500           # pacing delay during scheduled full syncs
#                                    #   (turbo default: 0)
# sync_interval_minutes = 5          # how often a full P0-P5 sync runs

[mail]
# Nodes heard within this window appear in Active Users and are eligible
# for queued full-message DM delivery. Presence is inferred, not guaranteed.
active_window_seconds = 900
# Initial retry delay after a transport send failure. Later failures back off.
retry_base_seconds = 30


############################
#### Allowed Node IDs ####
############################
# Provide a list of node IDs that are allowed to post to the urgent board.
# If this section is commented out, anyone can post to the urgent board.
# Example:
# [allow_list]
# allowed_nodes = 12345678,87654321
#
# [allow_list]
# allowed_nodes = !17d7e4b7


############################
#### API Gateway        ####
############################
# An internet-connected node can act as a "gateway": offline mesh nodes send it
# API requests (a generic HTTP GET to an allowed host, or an AI chat prompt) and
# it returns the result over the mesh. By default any node in [allow_list]
# allowed_nodes may use the gateway; set [gateway] allowed_nodes to lock it down
# to specific nodes. Reachable from the main menu as [A] API Gateway.
#
# [gateway]
# enabled = true
# allowed_hosts = wttr.in,api.example.com   ; outbound HTTP GET is restricted to these
# allowed_schemes = https
# allowed_nodes =                           ; lock gateway to these node IDs only (blank = any allow_list node)
# request_timeout = 20
# max_response_bytes = 800                  ; replies are truncated to fit LoRa
# rate_limit_per_node = 5                   ; max requests per minute per requester
# relay_targets = ai
#
# # AI relay — Project Nomad / Ollama / any OpenAI-compatible chat endpoint:
# ai_base_url = http://nomad.local:11434
# ai_dialect = ollama                       ; ollama | openai | nomad
# ai_model = llama3.2
# ai_api_key =                              ; sent as "Authorization: Bearer <key>"
#                                           ; for the openai AND nomad dialects.
#                                           ; A N.O.M.A.D / Open WebUI front end
#                                           ; normally answers 403 without it.
# ai_system_prompt = You are a helpful assistant reachable over an off-grid mesh radio. Answer conversationally and directly. Keep replies under 170 characters.
#
# Ask for brevity, but do NOT tell a small model to suppress conversational
# openers -- "No preamble", "no greetings", "answer only" and the like. A 3B
# model obeys that literally and stops REPLYING to a greeting, completing it
# instead: "Hello" comes back as 'Hello, World! in C: printf(...)', and "Hey
# are you available?" as a song title. Factual questions still answer fine,
# so it looks like the radio is dropping some replies rather than like a
# prompt problem. Cap the length and leave the model free to answer.


####################
#### Menu Items ####
####################
# Remove any menu items you don't plan on using with your BBS below
#
[menu]
# Default Main Menu options for reference
# [Q]uick Commands
# [B]BS
# [U]tilities
# [P]rofile
# Ask [N]omad -- shortcut straight to the Project Nomad AI question prompt,
#                skipping Utilities > API Gateway > Ask Project Nomad
# [A]PI Gateway -- HTTP/AI relay and store-and-forward mailbox
# [S]ettings    -- account linking (Linked Devices) and other user settings
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the main menu.
# NOTE: A and S are added automatically even if omitted here, so upgrading a
# node doesn't silently hide them -- an explicit list written before they
# existed would otherwise never show them.
#
# Numbers are assigned at render time, counting down the list you leave here,
# so a trimmed menu reads [1][2][3]... with no gaps. Removing an entry does
# not disable it: the letter still works with the global "!" prefix (!P for
# Profile), which keeps a hidden shortcut from stealing a key that an app or
# door game wants. E[X]IT is always [0] and always last.
main_menu_items = Q, B, U, P, N, A, S, X

# Default BBS Menu options for reference
# [P]rofile
# [M]ail
# [B]ulletins
# [C]hannel Dir
# [J]S8CALL
# E[X]IT
#
# Remove any menu items from the list below that you want to exclude from the BBS menu
bbs_menu_items = M, B, C, J, X

# Default Utilities Menu option for reference
# [S]tats
# [F]ortune
# [W]all of Shame
# [Z]ork
# E[X]IT
#
# The API Gateway moved to the main menu ([A]); typing 'a' here still works
# for muscle memory, but it is no longer listed in this menu.
#
# Remove any menu items from the list below that you want to exclude from the utilities menu
utilities_menu_items = S, F, W, G, X


###########################
#### BBS Settings      ####
###########################
# connection_log_max_rows: Maximum number of connection log events to retain in
# the database. Older rows are automatically pruned after each new event is written.
# Default: 5000. Set lower on memory-constrained devices.
#
# [bbs]
# connection_log_max_rows = 5000


###########################
#### DB Maintenance    ####
###########################
# Long-running unattended nodes prune diagnostic/log tables and checkpoint the
# SQLite WAL on a slow cadence so they never fill the SD card. Defaults shown;
# uncomment to override. Pruning only touches diagnostic/log tables and expired
# deletion-tombstones — never bulletins, mail, channels, or zork saves.
#
# [maintenance]
# maintenance_interval_minutes = 60      ; how often a prune pass runs (when idle)
# sync_transmissions_max_rows = 10000    ; per-frame TX/RX diagnostic log cap
# op_log_max_rows = 20000                ; event-log cap (hash-repair is the safety net)
# sync_session_history_max_rows = 2000   ; sync-burst history cap
# tombstone_max_age_days = 30            ; expire deletion tombstones after N days
# vacuum_interval_hours = 24             ; reclaim freed space (VACUUM) this often
# api_mailbox_max_age_days = 7           ; drop delivered store-and-forward API responses after N days
# api_mailbox_max_rows = 5000            ; hard cap on queued API responses (oldest dropped first)
# max_db_size_mb = 0                     ; cap on-disk DB size; oldest content is pruned (tombstoned,
#                                        ;   propagates mesh-wide) to stay under it. 0 = unlimited.
#                                        ;   Also settable in the web GUI (Settings -> Storage).


