###############################
#### Select radio + interface ####
###############################
# Meshtastic USB: type = serial
# Meshtastic WiFi: type = tcp
#
# MeshCore companion USB: type = meshcore_serial
# MeshCore companion TCP: type = meshcore_tcp
# MeshCore companion BLE: type = meshcore_ble
#
# MeshCore serial example:
# [interface]
# type = meshcore_serial
# port = /dev/ttyACM0
# baudrate = 115200
# channel_index = 0  ; MeshCore channel for broadcast notifications
#
# MeshCore TCP example:
# [interface]
# type = meshcore_tcp
# hostname = 192.168.1.100
# tcp_port = 5000
#
# MeshCore BLE example (ble_address may be omitted to scan):
# [interface]
# type = meshcore_ble
# ble_address = 12:34:56:78:90:AB
# ble_pin = 123456
#
# [type = serial] for USB connected Meshtastic devices
#If there are multiple serial devices connected, be sure to use the "port" option and specify a port
# Linux Example:
# port = /dev/ttyUSB0
#
# Windows Example:
# port = COM3
# [type = tcp] for network connected devices (ESP32 devices only - this does not work for WisBlock)
# If using tcp, remove the # from the beginning and replace 192.168.x.x with the IP address of your device
# Example:
# [interface]
# type = tcp
# hostname = 192.168.1.100

[interface]
type = serial
# port = /dev/ttyACM0
# hostname = 192.168.x.x


############################
#### BBS NODE SYNC LIST ####
############################
# Provide a list of other nodes running BaconBS to sync with. For Meshtastic,
# use !node IDs. For MeshCore, use full public keys or unique prefixes of at
# least 12 hexadecimal characters. All configured peers must use the same radio
# protocol; BaconBS does not bridge Meshtastic RF traffic to MeshCore RF traffic.
# Example:
# [sync]
# bbs_nodes = !17d7e4b7,!18e9f5a3,!1a2b3c4d

# [sync]
# bbs_nodes = !17d7e4b7
# sync_zork_saves = false
#
# Pull-only subscriber nodes (e.g. a low-power Pico cache node). This node
# answers their WANT/HASHMISS sync requests but never push-syncs or hash-repairs
# TO them, so they cause no reconcile churn. Put cache nodes here, NOT in
# bbs_nodes. Also settable in the web GUI (Settings -> Subscriber Nodes).
# subscriber_nodes = !a1b2c3d4
#
# Replication speed tuning. Defaults are conservative for busy meshes.
# For small meshes (e.g. 2 BBS nodes), enabling sync_turbo dramatically
# speeds up replication by lowering inter-frame pause and per-cycle caps.
# WARNING: only enable sync_turbo on small meshes (2-3 BBS nodes on the
# same channel). The inter-frame pause is what prevents LoRa packet
# collisions; with 3+ active BBS peers turbo can WORSEN convergence by
# causing the very packet loss it tries to outrun.
# sync_turbo = false
# sync_pause_seconds = 0.75          # delay between TX frames (turbo: 0.02)
# hash_repair_pause_seconds = 0.1    # delay between repair frames (turbo: 0.0)
# hash_chunk_pause_seconds = 1.5     # MINIMUM gap between consecutive HASHZ
#                                    # manifest chunks and between HASHREQ
#                                    # frames sent to the same peer. NOT
#                                    # affected by sync_turbo. Lowering risks
#                                    # the receiver's LoRa radio dropping
#                                    # trailing manifest chunks, which silently
#                                    # breaks the entire reconcile cycle.
#                                    # Only lower on non-LoRa transports.
# repair_cycle_seconds = 90          # min seconds between repair cycles per peer
#                                    #   (turbo default: 30)
# reconcile_max_per_pass = 20        # max records pulled/pushed per repair cycle
#                                    #   (turbo default: 100)
# full_sync_delay_ms = 500           # pacing delay during scheduled full syncs
#                                    #   (turbo default: 0)
# sync_interval_minutes = 5          # how often a full P0-P5 sync runs


############################
#### Allowed Node IDs ####
############################
# Provide a list of node IDs that are allowed to post to the urgent board.
# If this section is commented out, anyone can post to the urgent board.
# Example:
# [allow_list]
# allowed_nodes = 12345678,87654321
#
# [allow_list]
# allowed_nodes = !17d7e4b7


############################
#### API Gateway        ####
############################
# An internet-connected node can act as a "gateway": offline mesh nodes send it
# API requests (a generic HTTP GET to an allowed host, or an AI chat prompt) and
# it returns the result over the mesh. By default any node in [allow_list]
# allowed_nodes may use the gateway; set [gateway] allowed_nodes to lock it down
# to specific nodes. Add 'A' to utilities_menu_items below to expose the menu.
#
# [gateway]
# enabled = true
# allowed_hosts = wttr.in,api.example.com   ; outbound HTTP GET is restricted to these
# allowed_schemes = https
# allowed_nodes =                           ; lock gateway to these node IDs only (blank = any allow_list node)
# request_timeout = 20
# max_response_bytes = 800                  ; replies are truncated to fit LoRa
# rate_limit_per_node = 5                   ; max requests per minute per requester
# relay_targets = ai
#
# # AI relay — Project Nomad / Ollama / any OpenAI-compatible chat endpoint:
# ai_base_url = http://nomad.local:11434
# ai_dialect = ollama                       ; ollama | openai
# ai_model = llama3.2
# ai_api_key =                              ; only for openai-compatible endpoints
# ai_system_prompt = You are a concise assistant on an off-grid mesh. Keep replies short.


