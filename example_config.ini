##########################
#### JS8Call Settings ####
##########################
# If you would like messages from JS8Call to go into the BBS, uncomment and enter in info below:
# host = the IP address for your system running JS8Call
# port = TCP API port for JS8CALL - Default is 2442
# db_file = this can be left as the default "js8call.db" unless you need to change for some reason
# js8groups = the JS8Call groups you're interested in receiving into the BBS
# store_messages = "true" will send messages that arent part of a group into the BBS (can be noisy). "false" will ignore these
# js8urgent = the JS8Call groups you consider to be urgent - anything sent to these will have a notice sent to the
# group chat (similar to how the urgent bulletin board works
# [js8call]
# host = 192.168.1.100
# port = 2442
# db_file = js8call.db
# js8groups = @GRP1,@GRP2,@GRP3
# store_messages = True
# js8urgent = @URGNT

#
# Gap after each user-facing message (seconds, LoRa only -- MQTT skips it).
# A DM across several hops takes seconds to arrive and be acked, and the
# mesh is relaying it the whole time. Send the next one too soon and it
# collides with the first one's own relay traffic: the radio accepts it,
# nothing errors, and it simply never reaches the user. Raise this on a
# busy or multi-hop mesh; 2 is fine when the BBS is a direct neighbour.
# user_message_pause_seconds = 2
#
# How often a LOW-LATENCY link (MQTT) checks for sync work, in seconds.
# sync_interval_minutes above applies to radios, where airtime is scarce.
# MQTT has none of that, and everything inside a sync is already paced for
# it -- so waiting out a radio's five or ten minutes just to begin was
# nearly all of an MQTT bridge's sync latency. Radios are unaffected by
# this setting, including with sync_turbo on. Capped at
# sync_interval_minutes, so raising that still slows everything down.
# low_latency_sync_interval_seconds = 30
